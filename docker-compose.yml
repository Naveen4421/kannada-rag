services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  indexer:
    build:
      context: .
    restart: "no"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_PREFER_GRPC: "false"
    env_file:
      - path: .env
        required: false
    volumes:
      - model_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["python", "-m", "src.embeddings.embed"]

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_PREFER_GRPC: "false"
    env_file:
      - path: .env
        required: false
    volumes:
      - model_cache:/root/.cache/huggingface
    depends_on:
      indexer:
        condition: service_completed_successfully
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  qdrant_storage:
  model_cache:
